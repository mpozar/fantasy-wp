name: Deploy docs to GitHub Pages

# Replaces the legacy "deploy from a branch" Pages builder, which has a soft limit
# of ~10 builds/hour — and fast.sh pushes docs/data.json every 5 min (12/hour),
# so ~2/hour were throttled with a `401 Requires authentication` on the deploy step
# (the site still self-healed on the next success, but the runs were red). A custom
# Actions workflow isn't subject to that limit. fast.sh only ever commits
# docs/data.json, so the path filter means code commits don't trigger a deploy.

on:
  push:
    branches: ["main"]
    paths: ["docs/**"]
  workflow_dispatch:        # manual trigger for verification

permissions:
  contents: read
  pages: write
  id-token: write

# Only the latest published snapshot matters, but NEVER cancel an in-flight
# deploy: on 2026-07-02 GitHub's Pages backend slowed deploys from ~1 min to
# 4-10+ min, and with cancel-in-progress the 5-min ticks cancelled every deploy
# before it finished — no deploy completed and the site froze on stale data.
# With `false` the in-flight deploy completes, and GitHub still collapses
# *waiting* runs in the group to the newest one ("higher priority waiting
# request"), so rapid ticks can't queue up and the site updates once per
# deploy-duration at worst.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      # Whichever attempt landed the deploy (see the retry steps below).
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"
      # GitHub's Pages backend intermittently returns "Deployment failed, try
      # again later" — a transient the next 5-min tick clears on its own, but it
      # marks the run red and GitHub emails on every failed run (~1 in 4 at this
      # cadence = the email storm). Retry the deploy in-run with short backoff so
      # a transient no longer fails the run: same 5-min freshness, far fewer red
      # runs. The uploaded artifact ("github-pages") persists across attempts, and
      # a later attempt just supersedes any half-created earlier deployment
      # (last-write-wins = latest data). Only an all-attempts-fail run stays red.
      - name: Deploy to GitHub Pages
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Backoff before retry 1
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20
      - name: Deploy to GitHub Pages (retry 1)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Backoff before retry 2
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 40
      - name: Deploy to GitHub Pages (retry 2, final)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
