[project]
name = "fantasy-wp"
version = "0.1.0"
description = "Win probability estimator for a single ESPN H2H fantasy baseball league"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
app = "app.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
